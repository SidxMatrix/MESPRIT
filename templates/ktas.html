<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KTAS Emergency Triage System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        /* Light Mode - Orange/Amber Gradient with Glass */
body.light-mode {
    background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #fb923c 100%);
}

/* Make navbar transparent enough to show text in light mode */
body.light-mode header {
    background: rgba(255, 255, 255, 0.7) !important;
    backdrop-filter: blur(20px) !important;
}

/* Make sure "Welcome back" text stays dark and visible */
body.light-mode h1 {
    color: #0f172a !important;
}

body.light-mode p.text-gray-400 {
    color: #64748b !important;
}


body.light-mode .bg-slate-800\/50 {
    background: rgba(255, 251, 245, 0.85) !important;
    backdrop-filter: blur(10px) !important;
    border-color: rgba(251, 191, 36, 0.4) !important;
    box-shadow: 0 8px 32px rgba(249, 115, 22, 0.1) !important;
}

body.light-mode .text-white { 
    color: #0f172a !important; 
    font-weight: 600 !important; 
}

body.light-mode .text-gray-300 { color: #334155 !important; }
body.light-mode .text-gray-400 { color: #475569 !important; }

body.light-mode input, 
body.light-mode select {
    background: rgba(255, 251, 245, 0.9) !important;
    color: #0f172a !important;
    border-color: rgba(251, 191, 36, 0.3) !important;
}

/* Main header */
body.light-mode h1.text-xl.font-bold {
    color: #ea580c !important;
    font-weight: 800 !important;
}

body.light-mode p.text-xs {
    color: #f97316 !important;
    font-weight: 600 !important;
}

/* Patient Assessment stays dark */
body.light-mode h2.text-2xl.font-bold {
    color: #0f172a !important;
    font-weight: 800 !important;
}

/* Section headers */
body.light-mode h3.text-lg {
    color: #ea580c !important;
    font-weight: 700 !important;
}

/* Back button */
body.light-mode a[href="/dashboard"] {
    color: #ea580c !important;
    font-weight: 600 !important;
    background: rgba(234, 88, 12, 0.25) !important;
    border-color: rgba(234, 88, 12, 0.4) !important;
}

    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-orange-900 to-slate-900 min-h-screen">
   <!-- Header -->
<div class="bg-slate-800/50 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between max-w-6xl">
        <!-- Left: Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-orange-500 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">KTAS Emergency Triage</h1>
                <p class="text-xs text-orange-300">Korean Triage and Acuity Scale</p>
            </div>
        </div>
        
        <!-- Right: Theme toggle + Back button -->
        <div class="flex items-center gap-3">
            <button id="themeToggle" class="p-2 rounded-lg bg-slate-800/50 border border-slate-700 hover:border-orange-500/50 transition">
                <svg id="darkIcon" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg id="lightIcon" class="w-5 h-5 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
            <a href="/dashboard" class="px-4 py-2 bg-orange-500/20 hover:bg-orange-500/30 border border-orange-500/30 text-orange-300 rounded-lg text-sm font-medium transition">
                ← Back to Dashboard
            </a>
        </div>
    </div>
</div>


    <div class="container mx-auto px-6 py-12 max-w-6xl">
        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Form -->
            <div class="lg:col-span-2">
                <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl">
                    <h2 class="text-2xl font-bold text-white mb-6">Patient Assessment</h2>
                    
                    <form id="predictionForm" class="space-y-6">
                        <!-- Demographics -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-orange-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                Demographics
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Age</label>
                                    <input type="number" id="age" required min="0" max="120"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Gender</label>
                                    <select id="gender" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Vital Signs -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-orange-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                Vital Signs
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Heart Rate (bpm)</label>
                                    <input type="number" id="heartrate" required min="30" max="200"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Body Temperature (°C)</label>
                                    <input type="number" id="bodytemperature" required min="30" max="45" step="0.1"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Respiratory Rate (breaths/min)</label>
                                    <input type="number" id="respiratoryrate" required min="8" max="50"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Oxygen Saturation (%)</label>
                                    <input type="number" id="oxygensaturation" required min="50" max="100"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Systolic BP (mmHg)</label>
                                    <input type="number" id="systolicbp" required min="50" max="250"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Diastolic BP (mmHg)</label>
                                    <input type="number" id="diastolicbp" required min="30" max="150"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                </div>
                            </div>
                        </div>

                        <!-- Medical History -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-orange-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                Medical History
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Diagnosis</label>
                                    <select id="diagnosis" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="">Select Diagnosis</option>
                                        <option value="Asthma">Asthma</option>
                                        <option value="Bronchitis">Bronchitis</option>
                                        <option value="COVID-19">COVID-19</option>
                                        <option value="Chronic Kidney Disease">Chronic Kidney Disease</option>
                                        <option value="Dengue">Dengue</option>
                                        <option value="Diabetes">Diabetes</option>
                                        <option value="Healthy">Healthy</option>
                                        <option value="Hepatitis">Hepatitis</option>
                                        <option value="Hypertension">Hypertension</option>
                                        <option value="Influenza">Influenza</option>
                                        <option value="Malaria">Malaria</option>
                                        <option value="Pneumonia">Pneumonia</option>
                                        <option value="Tuberculosis">Tuberculosis</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Family History</label>
                                    <select id="familyhistory" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Lifestyle Factors -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-orange-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path>
                                </svg>
                                Lifestyle Factors
                            </h3>
                            
                            <div class="grid grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Smoking Status</label>
                                    <select id="smokingstatus" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="Never">Never</option>
                                        <option value="Former">Former</option>
                                        <option value="Current">Current</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Alcohol Use</label>
                                    <select id="alcoholuse" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Physical Activity</label>
                                    <select id="activitylevel" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-orange-500 focus:ring-2 focus:ring-orange-500/20">
                                        <option value="Low">Low</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="predictButton"
                                class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold py-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-orange-500/50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                            </svg>
                            <span>Assess Triage Level</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Results -->
            <div class="lg:col-span-1">
                <div id="resultsPanel" class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl sticky top-24">
                    <div class="text-center py-12">
                        <svg class="w-20 h-20 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                        </svg>
                        <h3 class="text-xl font-semibold text-gray-400 mb-2">Awaiting Assessment</h3>
                        <p class="text-gray-500 text-sm">Enter patient data for triage</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const button = document.getElementById('predictButton');
            const resultsPanel = document.getElementById('resultsPanel');
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Triaging...</span>
            `;
            
            resultsPanel.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 border-4 border-orange-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <h3 class="text-xl font-semibold text-white mb-2">Assessing Priority</h3>
                    <p class="text-gray-400 text-sm">Calculating triage level...</p>
                </div>
            `;
            
            try {
                const patientData = {
                    age: parseInt(document.getElementById('age').value),
                    gender: document.getElementById('gender').value,
                    heartrate: parseInt(document.getElementById('heartrate').value),
                    bodytemperature: parseFloat(document.getElementById('bodytemperature').value),
                    respiratoryrate: parseInt(document.getElementById('respiratoryrate').value),
                    oxygensaturation: parseInt(document.getElementById('oxygensaturation').value),
                    systolicbp: parseInt(document.getElementById('systolicbp').value),
                    diastolicbp: parseInt(document.getElementById('diastolicbp').value),
                    diagnosis: document.getElementById('diagnosis').value,
                    familyhistory: document.getElementById('familyhistory').value,
                    smokingstatus: document.getElementById('smokingstatus').value,
                    alcoholuse: document.getElementById('alcoholuse').value,
                    activitylevel: document.getElementById('activitylevel').value
                };
                
                const response = await fetch('/api/ktas/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patientData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const level = result.predicted_level;
                    const confidence = (result.confidence * 100).toFixed(1);
                    
                   let colorClass, bgClass, levelNum, urgency, waitTime, levelTitle;

// Check just the level number, not the full description
if (level.includes('Level 1') || level.includes('Resuscitation')) {
    colorClass = 'text-red-400';
    bgClass = 'bg-red-500/20 border-red-500/30';
    levelNum = '1';
    levelTitle = 'Level 1 - Resuscitation';
    urgency = 'IMMEDIATE';
    waitTime = '0 minutes';
} else if (level.includes('Level 2') || level.includes('Emergent')) {
    colorClass = 'text-orange-400';
    bgClass = 'bg-orange-500/20 border-orange-500/30';
    levelNum = '2';
    levelTitle = 'Level 2 - Emergent';
    urgency = 'URGENT';
    waitTime = '<15 minutes';
} else if (level.includes('Level 3') || level.includes('Urgent')) {
    colorClass = 'text-yellow-400';
    bgClass = 'bg-yellow-500/20 border-yellow-500/30';
    levelNum = '3';
    levelTitle = 'Level 3 - Urgent';
    urgency = 'SEMI-URGENT';
    waitTime = '<30 minutes';
} else if (level.includes('Level 4') || level.includes('Less Urgent')) {
    colorClass = 'text-green-400';
    bgClass = 'bg-green-500/20 border-green-500/30';
    levelNum = '4';
    levelTitle = 'Level 4 - Less Urgent';
    urgency = 'NON-URGENT';
    waitTime = '<60 minutes';
} else {
    colorClass = 'text-blue-400';
    bgClass = 'bg-blue-500/20 border-blue-500/30';
    levelNum = '5';
    levelTitle = 'Level 5 - Non-Urgent';
    urgency = 'NON-URGENT';
    waitTime = '<120 minutes';
}

                    
                    resultsPanel.innerHTML = `
                        <div class="fade-in">
                            <div class="text-center mb-6">
                                <div class="w-24 h-24 ${bgClass} border-2 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <div class="text-4xl font-bold ${colorClass}">L${levelNum}</div>
                                </div>
                                <h3 class="text-lg font-bold ${colorClass} mb-2">${levelTitle}</h3>

                                <div class="inline-block px-4 py-1 ${bgClass} border rounded-full">
                                    <p class="text-xs font-semibold ${colorClass}">${urgency}</p>
                                </div>
                            </div>
                            
                            <div class="space-y-4">
                                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-sm text-gray-400">Confidence</span>
                                        <span class="text-sm font-semibold text-white">${confidence}%</span>
                                    </div>
                                    <div class="w-full bg-slate-800 rounded-full h-2">
                                        <div class="bg-gradient-to-r from-orange-500 to-orange-600 h-2 rounded-full transition-all duration-500" style="width: ${confidence}%"></div>
                                    </div>
                                </div>
                                
                                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                                    <h4 class="text-white font-semibold mb-3 text-sm">Triage Information</h4>
                                    <div class="space-y-2 text-sm">
                                        <div class="flex justify-between">
                                            <span class="text-gray-400">Priority Level</span>
                                            <span class="${colorClass} font-semibold">Level ${levelNum}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-400">Max Wait Time</span>
                                            <span class="text-white">${waitTime}</span>
                                        </div>
                                        <div class="flex justify-between">
                                            <span class="text-gray-400">Assessment</span>
                                            <span class="text-white">${urgency}</span>
                                        </div>
                                    </div>
                                </div>
                                
                                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                                    <h4 class="text-white font-semibold mb-3 text-sm">All Levels Probability</h4>
                                    <div class="space-y-2">
                                        ${Object.entries(result.all_probabilities).map(([ktasLevel, prob]) => `
                                            <div>
                                                <div class="flex items-center justify-between text-xs mb-1">
                                                    <span class="text-gray-400">${ktasLevel}</span>
                                                    <span class="text-white font-medium">${(prob * 100).toFixed(1)}%</span>
                                                </div>
                                                <div class="w-full bg-slate-800 rounded-full h-1.5">
                                                    <div class="bg-gradient-to-r from-orange-500 to-orange-600 h-1.5 rounded-full" style="width: ${(prob * 100).toFixed(1)}%"></div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <div class="${bgClass} border rounded-lg p-4">
                                    <h4 class="text-white font-semibold mb-2 flex items-center gap-2 text-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        Action Required
                                    </h4>
                                    <p class="text-gray-300 text-xs leading-relaxed">
                                        ${levelNum === '1' ? 'IMMEDIATE intervention required. Activate emergency protocols.' :
                                          levelNum === '2' ? 'Rapid assessment and treatment within 15 minutes. High priority.' :
                                          levelNum === '3' ? 'Urgent care needed. Assess within 30 minutes.' :
                                          levelNum === '4' ? 'Standard care. Can wait up to 60 minutes with monitoring.' :
                                          'Non-urgent. Can wait up to 2 hours. Provide comfort measures.'}
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(result.error || 'Triage assessment failed');
                }
                
            } catch (error) {
                resultsPanel.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <h3 class="text-xl font-semibold text-red-400 mb-2">Assessment Failed</h3>
                        <p class="text-gray-400 text-sm">${error.message}</p>
                        <p class="text-gray-500 text-xs mt-2">Please verify patient data and try again</p>
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <span>Assess Triage Level</span>
                `;
            }
        });
        // Theme Toggle
const themeToggle = document.getElementById('themeToggle');
const darkIcon = document.getElementById('darkIcon');
const lightIcon = document.getElementById('lightIcon');

if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    darkIcon.classList.add('hidden');
    lightIcon.classList.remove('hidden');
}

themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    darkIcon.classList.toggle('hidden');
    lightIcon.classList.toggle('hidden');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
});

    </script>
</body>
</html>
