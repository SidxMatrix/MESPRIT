<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Prediction System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .fade-in { animation: fadeIn 0.5s ease-in; }

/* Light Mode - Disease Prediction */
body.light-mode {
    background: linear-gradient(135deg, #5B86E5 0%, #36D1DC 100%);
}

body.light-mode .bg-slate-800\/50,
body.light-mode .bg-slate-900\/50 {
    background: rgba(250, 249, 246, 0.85) !important;
    border-color: rgba(222, 217, 200, 0.5) !important;
}

body.light-mode .text-white { 
    color: #0f172a !important; 
    font-weight: 600 !important; 
}

body.light-mode .text-gray-300 { 
    color: #334155 !important; 
}

body.light-mode .text-gray-400 { 
    color: #475569 !important; 
}

body.light-mode input, 
body.light-mode select {
    background: rgba(250, 249, 246, 0.9) !important;
    color: #0f172a !important;
}

/* Main header title "Disease Prediction" */
body.light-mode h1.text-xl.font-bold {
    color: #1e40af !important;
    font-weight: 800 !important;
}

/* Subtitle "AI-Powered..." */
body.light-mode p.text-xs {
    color: #1d4ed8 !important;
    font-weight: 600 !important;
}

/* Patient Information stays dark */
body.light-mode h2.text-2xl.font-bold {
    color: #0f172a !important;
    font-weight: 800 !important;
}

/* Section headers: Demographics, Vital Signs, etc. */
body.light-mode h3.text-lg {
    color: #1e40af !important;
    font-weight: 700 !important;
}

body.light-mode h3.text-lg svg {
    color: #1d4ed8 !important;
}

/* Back to Dashboard button */
body.light-mode a[href="/dashboard"] {
    color: #1e40af !important;
    font-weight: 600 !important;
    background: rgba(37, 99, 235, 0.3) !important;
    border-color: rgba(37, 99, 235, 0.5) !important;
}



        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 min-h-screen">

    <!-- Header -->
<div class="bg-slate-800/50 backdrop-blur-xl border-b border-white/10 sticky top-0 z-50">
    <div class="container mx-auto px-6 py-4 flex items-center justify-between max-w-6xl">
        <!-- Left side: Title -->
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-500 rounded-lg flex items-center justify-center">
                <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold text-white">Disease Prediction</h1>
                <p class="text-xs text-blue-300">AI-Powered Disease Detection System</p>
            </div>
        </div>
        
        <!-- Right side: Theme toggle + Back button -->
        <div class="flex items-center gap-3">
            <button id="themeToggle" class="p-2 rounded-lg bg-slate-800/50 border border-slate-700 hover:border-blue-500/50 transition">
                <svg id="darkIcon" class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                </svg>
                <svg id="lightIcon" class="w-5 h-5 text-gray-400 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                </svg>
            </button>
            <a href="/dashboard" class="px-4 py-2 bg-blue-500/20 hover:bg-blue-500/30 border border-blue-500/30 text-blue-300 rounded-lg text-sm font-medium transition">
                ← Back to Dashboard
            </a>
        </div>
    </div>
</div>


    <div class="container mx-auto px-6 py-12 max-w-6xl">
        <!-- Main Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left: Form -->
            <div class="lg:col-span-2">
                <div class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl">
                    <h2 class="text-2xl font-bold text-white mb-6">Patient Information</h2>
                    
                    <form id="predictionForm" class="space-y-6">
                        <!-- Demographics -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-blue-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                                </svg>
                                Demographics
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Age *</label>
                                    <input type="number" id="age" required min="0" max="120" placeholder="e.g., 45"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Gender *</label>
                                    <select id="gender" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Vital Signs -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-blue-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                Vital Signs
                            </h3>
                            
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Heart Rate (bpm) *</label>
                                    <input type="number" id="heartrate" required min="30" max="200" placeholder="e.g., 75"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Body Temperature (°C) *</label>
                                    <input type="number" id="bodytemperature" required min="30" max="45" step="0.1" placeholder="e.g., 37.0"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Respiratory Rate (breaths/min) *</label>
                                    <input type="number" id="respiratoryrate" required min="8" max="50" placeholder="e.g., 18"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Oxygen Saturation (%) *</label>
                                    <input type="number" id="oxygensaturation" required min="50" max="100" placeholder="e.g., 98"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Systolic BP (mmHg) *</label>
                                    <input type="number" id="systolicbp" required min="50" max="250" placeholder="e.g., 120"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Diastolic BP (mmHg) *</label>
                                    <input type="number" id="diastolicbp" required min="30" max="150" placeholder="e.g., 80"
                                           class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                </div>
                            </div>
                        </div>

                        <!-- Lifestyle -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-blue-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"></path>
                                </svg>
                                Lifestyle Factors
                            </h3>
                            
                            <div class="grid grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Smoking Status *</label>
                                    <select id="smokingstatus" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                        <option value="Never">Never</option>
                                        <option value="Former">Former</option>
                                        <option value="Current">Current</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Alcohol Use *</label>
                                    <select id="alcoholuse" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                        <option value="No">No</option>
                                        <option value="Yes">Yes</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-300 mb-2">Physical Activity *</label>
                                    <select id="physicalactivitylevel" required
                                            class="w-full px-4 py-3 bg-slate-900/50 border border-slate-600 rounded-lg text-white focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-500/20">
                                        <option value="Low">Low</option>
                                        <option value="Moderate">Moderate</option>
                                        <option value="High">High</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- Symptoms -->
                        <div class="space-y-4">
                            <h3 class="text-lg font-semibold text-blue-300 flex items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                                </svg>
                                Symptoms (Select all that apply)
                            </h3>
                            
                            <div id="symptomsList" class="grid grid-cols-2 md:grid-cols-3 gap-3 max-h-96 overflow-y-auto pr-2">
                                <!-- Symptoms will be loaded here -->
                            </div>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" id="predictButton"
                                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-4 rounded-xl transition duration-200 flex items-center justify-center gap-2 shadow-lg shadow-blue-500/50">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                            </svg>
                            <span>Predict Disease</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Right: Results -->
            <div class="lg:col-span-1">
                <div id="resultsPanel" class="bg-slate-800/50 backdrop-blur-xl border border-slate-700/50 rounded-2xl p-8 shadow-2xl sticky top-24">
                    <div class="text-center py-12">
                        <svg class="w-20 h-20 text-gray-600 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                        </svg>
                        <h3 class="text-xl font-semibold text-gray-400 mb-2">Awaiting Input</h3>
                        <p class="text-gray-500 text-sm">Complete the form to get diagnosis</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Symptom list
        const symptoms = ["Fever", "Cough", "Shortness of Breath", "Fatigue", "Headache", "Body Aches", "Sore Throat", "Nausea", "Vomiting", "Diarrhea", "Loss of Taste", "Loss of Smell", "Chest Pain", "Chills", "Rash"];

        // Load symptoms
        const symptomsContainer = document.getElementById('symptomsList');
        symptoms.forEach(symptom => {
            const div = document.createElement('div');
            div.className = 'flex items-center';
            div.innerHTML = `
                <label class="flex items-center gap-2 cursor-pointer group">
                    <input type="checkbox" name="symptom" value="${symptom}" 
                           class="w-4 h-4 text-blue-600 bg-slate-900 border-slate-600 rounded focus:ring-blue-500 focus:ring-2">
                    <span class="text-sm text-gray-300 group-hover:text-white transition">${symptom}</span>
                </label>
            `;
            symptomsContainer.appendChild(div);
        });

        // Form submission
        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const button = document.getElementById('predictButton');
            const resultsPanel = document.getElementById('resultsPanel');
            
            // Show loading state
            button.disabled = true;
            button.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>Analyzing...</span>
            `;
            
            resultsPanel.innerHTML = `
                <div class="text-center py-12">
                    <div class="w-16 h-16 border-4 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                    <h3 class="text-xl font-semibold text-white mb-2">Processing Data</h3>
                    <p class="text-gray-400 text-sm">Analyzing symptoms...</p>
                </div>
            `;
            
            try {
                const checkedSymptoms = Array.from(document.querySelectorAll('input[name="symptom"]:checked'))
                    .map(checkbox => checkbox.value);
                
                const patientData = {
                    age: parseInt(document.getElementById('age').value),
                    gender: document.getElementById('gender').value,
                    heartrate: parseInt(document.getElementById('heartrate').value),
                    bodytemperature: parseFloat(document.getElementById('bodytemperature').value),
                    respiratoryrate: parseInt(document.getElementById('respiratoryrate').value),
                    oxygensaturation: parseInt(document.getElementById('oxygensaturation').value),
                    systolicbp: parseInt(document.getElementById('systolicbp').value),
                    diastolicbp: parseInt(document.getElementById('diastolicbp').value),
                    smokingstatus: document.getElementById('smokingstatus').value,
                    alcoholuse: document.getElementById('alcoholuse').value,
                    physicalactivitylevel: document.getElementById('physicalactivitylevel').value,
                    checkedsymptoms: checkedSymptoms
                };
                
                const response = await fetch('/api/disease/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(patientData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const disease = result.predicted_disease;
                    const confidence = (result.confidence * 100).toFixed(1);
                    
                    resultsPanel.innerHTML = `
                        <div class="fade-in">
                            <div class="text-center mb-6">
                                <div class="w-20 h-20 bg-blue-500/20 border-2 border-blue-500/30 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <svg class="w-10 h-10 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                    </svg>
                                </div>
                                <h3 class="text-2xl font-bold text-blue-400 mb-2">${disease}</h3>
                                <p class="text-gray-400 text-sm">Predicted Diagnosis</p>
                            </div>
                            
                            <div class="space-y-4">
                                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                                    <div class="flex items-center justify-between mb-2">
                                        <span class="text-sm text-gray-400">Confidence Level</span>
                                        <span class="text-sm font-semibold text-white">${confidence}%</span>
                                    </div>
                                    <div class="w-full bg-slate-800 rounded-full h-2">
                                        <div class="bg-gradient-to-r from-blue-500 to-blue-600 h-2 rounded-full transition-all duration-500" style="width: ${confidence}%"></div>
                                    </div>
                                </div>
                                
                                <div class="bg-slate-900/50 border border-slate-700 rounded-lg p-4">
                                    <h4 class="text-white font-semibold mb-3 text-sm">Disease Distribution</h4>
                                    <div class="space-y-2">
                                        ${Object.entries(result.all_probabilities).slice(0, 5).map(([diseaseName, prob]) => `
                                            <div>
                                                <div class="flex items-center justify-between text-sm mb-1">
                                                    <span class="text-gray-400">${diseaseName}</span>
                                                    <span class="text-white font-medium">${(prob * 100).toFixed(1)}%</span>
                                                </div>
                                                <div class="w-full bg-slate-800 rounded-full h-1.5">
                                                    <div class="bg-gradient-to-r from-blue-500 to-blue-600 h-1.5 rounded-full" style="width: ${(prob * 100).toFixed(1)}%"></div>
                                                </div>
                                            </div>
                                        `).join('')}
                                    </div>
                                </div>
                                
                                <div class="bg-blue-500/20 border border-blue-500/30 rounded-lg p-4">
                                    <h4 class="text-white font-semibold mb-2 flex items-center gap-2 text-sm">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                        </svg>
                                        Important Notice
                                    </h4>
                                    <p class="text-gray-300 text-xs leading-relaxed">
                                        This is an AI-generated prediction for educational purposes. Please consult with a qualified healthcare professional for proper diagnosis and treatment.
                                    </p>
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    throw new Error(result.error || 'Prediction failed');
                }
                
            } catch (error) {
                resultsPanel.innerHTML = `
                    <div class="text-center py-12">
                        <svg class="w-16 h-16 text-red-400 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <h3 class="text-xl font-semibold text-red-400 mb-2">Prediction Failed</h3>
                        <p class="text-gray-400 text-sm">${error.message}</p>
                        <p class="text-gray-500 text-xs mt-2">Please check your inputs and try again</p>
                    </div>
                `;
            } finally {
                button.disabled = false;
                button.innerHTML = `
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                    </svg>
                    <span>Predict Disease</span>
                `;
            }
        });
        // Theme Toggle
const themeToggle = document.getElementById('themeToggle');
const darkIcon = document.getElementById('darkIcon');
const lightIcon = document.getElementById('lightIcon');

if (localStorage.getItem('theme') === 'light') {
    document.body.classList.add('light-mode');
    darkIcon.classList.add('hidden');
    lightIcon.classList.remove('hidden');
}

themeToggle.addEventListener('click', () => {
    document.body.classList.toggle('light-mode');
    darkIcon.classList.toggle('hidden');
    lightIcon.classList.toggle('hidden');
    localStorage.setItem('theme', document.body.classList.contains('light-mode') ? 'light' : 'dark');
});

    </script>
</body>
</html>
